<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Hub</title>
<script>
  // GitHub Pages 404 redirect trick
  // Redirects /Hanukkah-family-phone/anything back to the app
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>Redirecting to Family Hub...</body>
</html>
